egoe UI', Roboto, Helvetica, Arial, sans-serif">Smart Mining Rover</text><text x="30" y="72" font-size="13" fill="#93c5fd" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" letter-spacing=".5">IoT-Based Autonomous Rover</text><text x="30" y="106" font-size="13.5" fill="#dbeafe" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Autonomous rover for remote monitoring, navigation and</text><text x="30" y="127" font-size="13.5" fill="#dbeafe" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">environmental data collection with obstacle detection and</text><text x="30" y="148" font-size="13.5" fill="#dbeafe" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">real-time data transmission.</text><rect x="30" y="180" width="58.5" height="26" rx="13" fill="#fff" fill-opacity=".10" stroke="#60a5fa" stroke-opacity=".55"/><text x="59.25" y="197.5" text-anchor="middle" font-size="11.5" fill="#e0f2fe" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">ESP32</text><rect x="96.5" y="180" width="44.7" height="26" rx="13" fill="#fff" fill-opacity=".10" stroke="#60a5fa" stroke-opacity=".55"/><text x="118.85" y="197.5" text-anchor="middle" font-size="11.5" fill="#e0f2fe" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">IoT</text><rect x="149.2" y="180" width="72.30000000000001" height="26" rx="13" fill="#fff" fill-opacity=".10" stroke="#60a5fa" stroke-opacity=".55"/><text x="185.35" y="197.5" text-anchor="middle" font-size="11.5" fill="#e0f2fe" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Sensors</text><rect x="229.5" y="180" width="72.30000000000001" height="26" rx="13" fill="#fff" fill-opacity=".10" stroke="#60a5fa" stroke-opacity=".55"/><text x="265.65" y="197.5" text-anchor="middle" font-size="11.5" fill="#e0f2fe" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Arduino</text></svg>
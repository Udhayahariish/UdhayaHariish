<clipPath id="c"><rect width="1000" height="190" rx="22"/></clipPath></defs><g clip-path="url(#c)"><rect width="1000" height="190" fill="url(#bg)"/><g filter="url(#b)" opacity="0.3"><g><animateTransform attributeName="transform" type="translate" values="-50 0;50 0;-50 0" dur="20s" begin="-0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/><use xlink:href="#cloud" transform="translate(750.0 40) scale(0.9)"/></g></g><g filter="url(#b)" opacity="0.22"><g><animateTransform attributeName="transform" type="translate" values="-60 0;60 0;-60 0" dur="26s" begin="-6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/><use xlink:href="#cloud" transform="translate(200.0 170) scale(0.8)"/></g></g><circle cx="950" cy="140" r="26" fill="url(#orb)"><animate attributeName="cy" values="140;128;140" dur="7s" begin="-0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle><circle cx="40" cy="30" r="16" fill="url(#orb)"><animate attributeName="cy" values="30;20;30" dur="6s" begin="-2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle><rect width="1000" height="190" fill="url(#glass)"/><rect x="0" y="-20" width="280.0" height="230" fill="url(#sheen)" transform="skewX(-20)"><animateTransform attributeName="transform" type="translate" additive="sum" values="-400.0 0;1200.0 0" dur="8s" begin="-1s" repeatCount="indefinite"/></rect></g><rect x=".8" y=".8" width="998.4" height="188.4" rx="21.5" fill="none" stroke="url(#edge)" stroke-width="1.5"><animate attributeName="stroke-opacity" values=".5;1;.5" dur="5s" begin="-0s" repeatCount="indefinite"/></rect><text x="30" y="48" font-size="16" fill="#dbeafe" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">B.Tech student in Artificial Intelligence &amp; Data Science with strong skills in Python, SQL, Machine Learning, Generative</text><text x="30" y="75" font-size="16" fill="#dbeafe" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">AI, LLMs, Prompt Engineering, Flask API development, Data Analytics and Power BI.</text><text x="30" y="116" font-size="16" fill="#dbeafe" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">I build AI-powered applications, intelligent chatbots, predictive models and analytics dashboards, and I love combining AI</text><text x="30" y="143" font-size="16" fill="#dbeafe" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">+ IoT + Computer Vision to create practical, real-world solutions.</text></svg>